# ===============================
# APPLICATION
# ===============================
spring.application.name=tourism-management-system

# ===============================
# DATABASE (Dynamic Cloud Fallback to Localhost)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/tourism_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:Sagar}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE & EXPLICIT DIALECT
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=${JPA_DDL:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# SERVER
# ===============================
server.port=${PORT:8080}

# ===============================
# CORS
# ===============================
cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:4173}

# ===============================
# JWT
# ===============================
jwt.secret=ThisIsMyVerySecureSecretKeyForTourismManagementSystem2026
jwt.expiration=86400000

logging.level.org.springframework.security=DEBUG

